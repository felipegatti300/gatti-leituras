<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados padrão App Store / Android -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

  <!-- Brilho de fundo -->
  <circle cx="256" cy="240" r="160" fill="url(#primaryGrad)" opacity="0.12" filter="url(#glow)"/>

  <!-- Monograma G & Livro Aberto com Ondas de Áudio -->
  <g transform="translate(0, -10)">
    <!-- Páginas do livro formando a base -->
    <path d="M120 330 C 180 300, 230 310, 256 335 C 282 310, 332 300, 392 330" 
          fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Estrutura do G estilizado como livro e fone -->
    <path d="M 350 175 
             C 310 120, 202 120, 162 175 
             C 122 230, 122 300, 162 355 
             C 202 410, 310 410, 350 355 
             C 370 327, 375 295, 375 260 
             L 256 260" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ondas sonoras centrais (Voz Neural) -->
    <line x1="226" y1="230" x2="226" y2="290" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <line x1="256" y1="200" x2="256" y2="320" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="286" y1="220" x2="286" y2="300" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <line x1="316" y1="240" x2="316" y2="280" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Tipografia de Assinatura -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" 
        fill="#f8fafc" text-anchor="middle" letter-spacing="4">GATTI</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" 
        fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">LEITURAS</text>
</svg>
